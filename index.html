<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>мяу</title>

    <!-- Вариативный шрифт Google Sans Flex со всеми осями -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@6..144,-10..0,25..151,1..1000,0..100&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Класс вариативного шрифта строго по шаблону */
        .google-sans-flex-wave {
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings:
                "slnt" 0,
                "wdth" 100,
                "ROND" 0;
        }

        :root {
            /* Динамические токены Material You (Monet), перезаписываются из палитры обоев */
            --md-sys-color-background: #0a0f12;
            --md-sys-color-primary: #7cd4e5;
            --md-sys-color-on-primary: #00363f;
            --md-sys-color-primary-container: #004e5a;
            --md-sys-color-on-primary-container: #b4ebfa;
            --md-sys-color-secondary: #b1cbd1;
            --md-sys-color-secondary-container: #334a50;
            --md-sys-color-tertiary: #bac6ea;
            --md-sys-color-on-surface: #dee3e5;
            --md-sys-color-on-surface-variant: #899295;
            --md-sys-color-outline-variant: #3f484b;
            --cookie-pressed: #a6e6f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            font-family: "Google Sans Flex", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* WebGL холст генератора световых обоев Lumina Aura и Liquid Glass */
        #gl-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* Полноэкранная минималистичная сцена Material 3 Expressive */
        .md3-stage {
            position: fixed;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Вертикальное окно сменяющихся строк Google Sans Flex Wave */
        .wave-stack-viewport {
            position: relative;
            width: 100%;
            overflow: hidden;
            margin-bottom: 18px;
            transition: opacity 0.55s cubic-bezier(0.2, 0, 0, 1), transform 0.55s cubic-bezier(0.2, 0, 0, 1);
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                #000 18%,
                #000 82%,
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                #000 18%,
                #000 82%,
                transparent 100%
            );
        }

        .wave-stack-viewport.is-hidden {
            opacity: 0;
            transform: translateY(-16px) scale(0.95);
            pointer-events: none;
        }

        /* Целая строка со словом */
        .wave-row {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 0.92;
            letter-spacing: -0.03em;
            white-space: nowrap;
            contain: layout style;
            will-change: transform, font-variation-settings, color;
        }

        /* Скрытый эталон для точного замера ширины при максимальном wdth: 151, wght: 950 */
        #text-probe {
            position: fixed;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            pointer-events: none;
            white-space: nowrap;
            font-size: 100px;
            letter-spacing: -0.03em;
            font-variation-settings: "wght" 950, "slnt" 0, "wdth" 151, "ROND" 100;
        }

        /* Волнистый индикатор прогресса MD3 LinearWavyProgressIndicator */
        .wavy-progress-wrapper {
            width: min(82vw, 340px);
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(40px, 7vh, 68px);
            transition: opacity 0.55s cubic-bezier(0.2, 0, 0, 1), transform 0.55s cubic-bezier(0.2, 0, 0, 1);
        }

        .wavy-progress-wrapper.is-hidden {
            opacity: 0;
            transform: translateY(-10px) scale(0.92);
            pointer-events: none;
        }

        #wavy-canvas {
            width: 100%;
            height: 22px;
            display: block;
        }

        /* Центральная кнопка MD3 Cookie */
        .cookie-button {
            position: relative;
            width: clamp(164px, 40vw, 204px);
            height: clamp(164px, 40vw, 204px);
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            touch-action: none;
            will-change: transform;
        }

        .cookie-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            shape-rendering: geometricPrecision;
            will-change: transform;
        }

        /* Контейнер взаимодействия: переключается с кнопки Cookie на два Liquid Glass сердечка */
        .interaction-hub {
            position: relative;
            width: min(92vw, 380px);
            height: clamp(200px, 44vw, 240px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cookie-button.is-hidden {
            opacity: 0;
            transform: scale(0.45) !important;
            pointer-events: none;
            transition: opacity 0.45s cubic-bezier(0.2, 0, 0, 1), transform 0.45s cubic-bezier(0.2, 0, 0, 1);
        }

        /* Сцена смешивания двух Liquid Glass сердечек в финале */
        .hearts-arena {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s cubic-bezier(0.2, 0, 0, 1);
        }

        .hearts-arena.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Невидимые тактильные зоны захвата для перетягивания WebGL-сердечек */
        .heart-hit-zone {
            position: absolute;
            width: 196px;
            height: 196px;
            border-radius: 50%;
            cursor: grab;
            touch-action: none;
            will-change: transform;
        }

        .heart-hit-zone:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <!-- WebGL холст генератора световых обоев Lumina Aura и оптического Liquid Glass -->
    <canvas id="gl-canvas" aria-hidden="true"></canvas>

    <main class="md3-stage">
        <!-- Скрытый эталон для расчёта размера шрифта под самую широкую фразу -->
        <span id="text-probe" class="google-sans-flex-wave" aria-hidden="true"></span>

        <!-- Вертикальная лента слов с эффектом Google Sans Flex Wave -->
        <div id="wave-stack" class="wave-stack-viewport" aria-live="polite"></div>

        <!-- Волнистый индикатор прогресса Material 3 Expressive -->
        <div id="wavy-wrapper" class="wavy-progress-wrapper">
            <canvas id="wavy-canvas"></canvas>
        </div>

        <!-- Центральный узел взаимодействия: Cookie -> Два Liquid Glass сердечка -->
        <div class="interaction-hub">
            <!-- Центральная фигура MD3 Cookie, окрашенная по динамической палитре Monet -->
            <button type="button"
                    id="cookie-btn"
                    class="cookie-button"
                    aria-label="Удерживайте фигуру">
                <svg class="cookie-svg" id="cookie-svg" viewBox="0 0 108 108" aria-hidden="true">
                    <path id="cookie-path" fill="#7cd4e5"></path>
                </svg>
            </button>
        </div>

        <!-- Финальная сцена: интерактивные зоны для перетягивания двух оптических Liquid Glass сердечек -->
        <div id="hearts-arena" class="hearts-arena" aria-label="Смешайте розовое и голубое Liquid Glass сердечки">
            <div id="heart-pink" class="heart-hit-zone" role="slider" aria-label="Розовое Liquid Glass сердце"></div>
            <div id="heart-blue" class="heart-hit-zone" role="slider" aria-label="Голубое Liquid Glass сердце"></div>
        </div>
    </main>

    <!-- Вершинный шейдер Lumina Aura -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>

    <!-- Фрагментный шейдер Lumina Aura: оптическая каустика и световая аура -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision highp float;

        uniform vec2 u_resolution;
        uniform float u_time;

        uniform vec2 u_offset;
        uniform float u_scale;
        uniform float u_aspect;
        uniform float u_rotation;
        uniform float u_morph;
        uniform float u_seed;
        uniform int u_shapeType;

        uniform float u_focusAngle;
        uniform float u_sharpness;
        uniform float u_diffusion;
        uniform float u_drift;

        uniform vec3 u_bgColor;
        uniform vec3 u_outerColor;
        uniform vec3 u_midColor;
        uniform vec3 u_coreColor;
        uniform float u_intensity;
        uniform float u_chromatic;

        uniform float u_grain;
        uniform float u_vignette;

        mat2 rot2D(float a) {
            float s = sin(a);
            float c = cos(a);
            return mat2(c, -s, s, c);
        }

        float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
        }

        float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
        }

        float valueNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash12(i);
            float b = hash12(i + vec2(1.0, 0.0));
            float c = hash12(i + vec2(0.0, 1.0));
            float d = hash12(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float sdEllipseApprox(vec2 p, vec2 ab) {
            vec2 q = p / ab;
            float r = length(q);
            vec2 grad = q / ab;
            float gLen = max(length(grad), 1e-4);
            return (r - 1.0) / gLen;
        }

        float sdOrganicAura(vec2 p, float radius, float morphAmt, float seed, float time) {
            vec2 c1 = vec2(-0.48, -0.02) * radius;
            vec2 c2 = vec2(0.12, -0.22) * radius;
            vec2 c3 = vec2(0.24, 0.24) * radius;

            float s1 = sin(seed * 6.283 + time * 0.6) * 0.14 * morphAmt;
            float s2 = cos(seed * 9.424 + time * 0.5) * 0.14 * morphAmt;

            c1 += vec2(s1, s2) * radius;
            c2 += vec2(-s2 * 0.7, s1 * 0.8) * radius;
            c3 += vec2(s1 * 0.6, -s2 * 0.9) * radius;

            float d1 = length(p - c1) - radius * (0.42 + 0.08 * morphAmt);
            float d2 = length(p - c2) - radius * (0.56 + 0.06 * morphAmt);
            float d3 = length(p - c3) - radius * (0.58 + 0.10 * morphAmt);

            float k = radius * (0.48 + 0.25 * morphAmt);
            float d = smin(d1, d2, k);
            d = smin(d, d3, k * 1.1);

            if (morphAmt > 0.01) {
                float angle = atan(p.y, p.x);
                float wave = sin(angle * 3.0 + seed * 12.0 + time * 0.4) * 0.035
                           + cos(angle * 2.0 - seed * 7.0) * 0.025;
                d += wave * radius * morphAmt;
            }
            return d;
        }

        void main() {
            float minDim = min(u_resolution.x, u_resolution.y);
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / minDim;

            vec2 focusDir = vec2(cos(u_focusAngle), sin(u_focusAngle));
            vec2 p = uv - u_offset;

            float refSpan = max(u_scale * 1.15, 0.15);
            float focusAlign = clamp(dot(p, focusDir) / refSpan, -1.2, 1.2);
            float tDiff = smoothstep(0.85, -0.95, focusAlign);
            float tDiffPow = pow(tDiff, 1.35);

            vec2 plumeShift = focusDir * (u_drift * u_scale * 0.52 * pow(tDiff, 1.65));
            vec2 pShape = p + plumeShift;
            vec2 pRot = rot2D(-u_rotation) * pShape;

            if (u_morph > 0.001 && u_shapeType != 1) {
                float n = valueNoise(pRot * (3.2 / max(u_scale, 0.1)) + vec2(u_seed * 10.0, u_time * 0.25));
                pRot += (n - 0.5) * u_scale * 0.16 * u_morph;
            }

            float dist = 0.0;
            float interiorFill = 0.0;

            if (u_shapeType == 0) {
                vec2 ab = vec2(u_scale, u_scale * u_aspect);
                float dEll = sdEllipseApprox(pRot, ab);
                float rimHalfWidth = mix(0.0035, 0.022, tDiffPow) * (u_scale / 0.34);
                dist = abs(dEll) - rimHalfWidth;
            } else if (u_shapeType == 1) {
                vec2 pAura = vec2(pRot.x, pRot.y / mix(0.75, 1.0, u_aspect));
                dist = sdOrganicAura(pAura, u_scale, u_morph, u_seed, u_time);
                interiorFill = smoothstep(0.015, -u_scale * 0.45, dist);
            } else {
                vec2 ab = vec2(u_scale, u_scale * u_aspect);
                float dOuter = sdEllipseApprox(pRot, ab);
                vec2 innerOffset = rot2D(-u_rotation) * (focusDir * u_scale * 0.14);
                float dInner = sdEllipseApprox(pRot - innerOffset, ab * 0.86);
                dist = max(dOuter, -dInner);
                interiorFill = smoothstep(0.01, -u_scale * 0.16, dist) * 0.65;
            }

            float sharpSigma = mix(0.048, 0.0028, u_sharpness) * (u_scale / 0.34);
            float softSigma = mix(0.04, 0.36, u_diffusion) * (u_scale / 0.34);
            float localSigma = mix(sharpSigma, softSigma, tDiffPow);

            float posDist = max(dist, 0.0);

            float coreGlow = exp(-pow(posDist / max(localSigma * 0.42, 0.0018), 2.0));
            if (u_shapeType == 1 || u_shapeType == 2) {
                coreGlow = max(coreGlow, interiorFill * (1.0 - 0.38 * tDiffPow));
            }

            float midSigma = mix(sharpSigma * 2.4, softSigma * 0.95, pow(tDiff, 1.1));
            float midGlow = exp(-posDist / max(midSigma, 0.004));
            if (u_shapeType == 1) {
                midGlow = max(midGlow, smoothstep(0.05, -u_scale * 0.2, dist));
            }

            float wideSigma = mix(sharpSigma * 5.0, softSigma * 1.55, pow(tDiff, 0.85));
            float wideGlow = 1.0 / (1.0 + pow(posDist / max(wideSigma, 0.01), 1.75));
            wideGlow *= mix(0.28, 1.0, pow(tDiff, 0.75));

            vec3 col = u_bgColor;

            float outerEnergy = wideGlow * 0.62 * u_intensity;
            col = mix(col, u_outerColor, clamp(outerEnergy, 0.0, 1.0));

            float midEnergy = pow(midGlow, 1.15) * 0.88 * u_intensity;
            if (u_chromatic > 0.01) {
                float rimBand = smoothstep(0.0, 0.45, midGlow) * (1.0 - smoothstep(0.45, 0.95, coreGlow));
                vec3 rimTint = mix(u_outerColor * 1.28, u_midColor * 1.15, 0.45);
                col = mix(col, max(rimTint, vec3(0.0)), clamp(rimBand * u_chromatic * 0.72, 0.0, 1.0));
            }
            col = mix(col, u_midColor, clamp(midEnergy, 0.0, 1.0));

            float coreEnergy = pow(coreGlow, 1.25) * u_intensity;
            col += u_coreColor * coreEnergy * 0.92;

            col = col / (1.0 + col * 0.22);
            col = mix(col, smoothstep(0.0, 1.0, col), 0.14);

            vec2 vigUV = gl_FragCoord.xy / u_resolution.xy - 0.5;
            float vig = 1.0 - dot(vigUV, vigUV) * u_vignette * 1.35;
            col *= clamp(vig, 0.35, 1.05);

            vec2 grainCoord = gl_FragCoord.xy * (1080.0 / max(minDim, 1.0));
            float n1 = hash12(grainCoord + fract(u_seed * 71.3) * 100.0);
            float n2 = hash12(grainCoord * 1.37 + vec2(17.1, 31.7) + fract(u_seed * 33.7) * 100.0);
            float grainNoise = (n1 + n2 - 1.0);

            col += grainNoise * u_grain;
            col = clamp(col, 0.0, 1.0);

            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <!-- Фрагментный шейдер физического оптического Liquid Glass (захардкоженная конфигурация) -->
    <script id="glass-fragment-shader" type="x-shader/x-fragment">
        precision highp float;

        uniform sampler2D u_bgTex;
        uniform vec2 u_resolution;
        uniform float u_heartsAlpha;
        uniform float u_blend;

        uniform vec2 u_heart1Pos;
        uniform vec2 u_heart2Pos;
        uniform float u_heart1Scale;
        uniform float u_heart2Scale;

        // Захардкоженные физические параметры Liquid Glass:
        // Толщина края: 268%, Сила преломления: 258%, IOR: 2.50, Дисперсия: 87%,
        // Блик по контуру: Выкл., Плотность стекла: 69%, Размытие: 51%,
        // Яркость обводки: Выкл., Парящая тень: Выкл., Тень под стеклом: Выкл., Насыщенные цвета: Вкл.
        uniform float u_glassEnabled;
        uniform float u_edgeThickness;
        uniform float u_refractionStrength;
        uniform float u_ior;
        uniform float u_dispersion;
        uniform float u_contourGlint;
        uniform float u_glassDensity;
        uniform float u_blur;
        uniform float u_rimBrightness;
        uniform float u_floatingShadow;
        uniform float u_contactShadow;
        uniform float u_vibrantColors;

        float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
        }

        float cross2(vec2 a, vec2 b) {
            return a.x * b.y - a.y * b.x;
        }

        float distToRightHeartBoundary(vec2 q) {
            vec2 P_cleft = vec2(0.0, 0.461243);
            vec2 P_tip   = vec2(0.0, -0.76);
            vec2 T       = vec2(0.825, 0.35);

            vec2 C1 = vec2(0.405, 0.35);
            float R1 = 0.420;
            vec2 vStart1 = P_cleft - C1;

            vec2 w1 = q - C1;
            float d1;
            if (w1.y >= 0.0 && cross2(w1, vStart1) >= 0.0) {
                d1 = abs(length(w1) - R1);
            } else {
                d1 = min(length(q - P_cleft), length(q - T));
            }

            vec2 C2 = vec2(-0.334227, 0.35);
            float R2 = 1.159227;
            vec2 vEnd2 = P_tip - C2;

            vec2 w2 = q - C2;
            float d2;
            if (w2.y <= 0.0 && cross2(vEnd2, w2) >= 0.0) {
                d2 = abs(length(w2) - R2);
            } else {
                d2 = min(length(q - T), length(q - P_tip));
            }

            return min(d1, d2);
        }

        float sdMaterialHeart(vec2 p) {
            p *= 0.90;

            vec2 C1  = vec2(0.405, 0.35);
            float R1 = 0.420;
            vec2 C2  = vec2(-0.334227, 0.35);
            float R2 = 1.159227;

            vec2 q = vec2(abs(p.x), p.y);
            bool inside = (q.y >= 0.35)
                ? (length(q - C1) < R1)
                : (length(q - C2) < R2);

            float dist = distToRightHeartBoundary(q);
            if (!inside && q.y > 0.25) {
                dist = min(dist, distToRightHeartBoundary(vec2(-q.x, q.y)));
            }

            return (inside ? -dist : dist) / 0.90;
        }

        vec2 evalLiquidField(vec2 pxCoord) {
            float d1 = sdMaterialHeart((pxCoord - u_heart1Pos) / u_heart1Scale) * u_heart1Scale;
            float d2 = sdMaterialHeart((pxCoord - u_heart2Pos) / u_heart2Scale) * u_heart2Scale;

            float k = mix(16.0, 62.0, u_blend);
            float d = smin(d1, d2, k);
            float w = clamp(0.5 + 0.5 * (d2 - d1) / max(k, 0.001), 0.0, 1.0);
            return vec2(d, w);
        }

        // Суперэллиптический профиль мениска жидкого стекла:
        // гладкое плато в центре и глубокая линзовая фаска на кромке (268%)
        float glassBevelHeight(float d, float bevelWidth) {
            if (d >= 0.0) return 0.0;
            float t = clamp(-d / max(bevelWidth, 1.0), 0.0, 1.0);
            float inv = 1.0 - t;
            return pow(max(0.0, 1.0 - pow(inv, 2.25)), 0.46);
        }

        // 16-tap Vogel spiral disc bokeh для гладкого размытия без полос
        vec3 sampleVogelBlur(vec2 uv, vec2 offsetUv, float blurPx) {
            vec2 c = clamp(uv + offsetUv, 0.002, 0.998);
            if (blurPx <= 0.15) {
                return texture2D(u_bgTex, c).rgb;
            }
            vec2 texel = 1.0 / u_resolution;
            vec3 acc = vec3(0.0);
            const float GOLDEN_ANGLE = 2.39996323;
            for (int i = 0; i < 16; i++) {
                float fi = float(i);
                float r = sqrt((fi + 0.5) / 16.0) * blurPx;
                float theta = fi * GOLDEN_ANGLE;
                vec2 tapOffset = vec2(cos(theta), sin(theta)) * r * texel;
                acc += texture2D(u_bgTex, clamp(c + tapOffset, 0.002, 0.998)).rgb;
            }
            return acc / 16.0;
        }

            float hL = glassBevelHeight(evalLiquidField(px - vec2(eps, 0.0)).x, bevelWidth);
            float hU = glassBevelHeight(evalLiquidField(px + vec2(0.0, eps)).x, bevelWidth);
            float hD = glassBevelHeight(evalLiquidField(px - vec2(0.0, eps)).x, bevelWidth);

            vec2 grad = vec2(hR - hL, hU - hD) / (2.0 * eps);
            vec2 slope2D = -grad * bevelWidth;
            float slopeStrength = mix(0.65, 2.25, clamp(u_refractionStrength / 1.5, 0.0, 2.0));
            vec3 N = normalize(vec3(slope2D * slopeStrength, 1.0));
            vec3 V = vec3(0.0, 0.0, 1.0);

            float edgeZone = smoothstep(-bevelWidth, -0.35, d);
            float rimBand = pow(edgeZone, 1.40);

            // Физическое преломление по закону Снеллиуса (IOR: 2.50, Сила преломления: 258%)
            float eta = 1.0 / max(1.0001, u_ior);

            if (dot(refractedRay, refractedRay) < 0.0001) {

            vec2 rayDir2D = refractedRay.xy / max(abs(refractedRay.z), 0.28);

            float slabDepth = baseScale * 0.62 * u_refractionStrength * (0.24 + 0.76 * hCenter);
            vec2 baseShiftUv = (rayDir2D * slabDepth) / u_resolution;

            // Спектральная дисперсия (5 длин волн по формуле Коши: 87%)
            float dispersionSpan = (max(1.0001, u_ior) - 1.0) * 1.25 * u_dispersion * rimBand;
            float blurPx = u_blur * 15.0 * dpr * mix(1.0, 0.28, rimBand);

            vec3 refracted = vec3(0.0);
            if (dispersionSpan > 0.002) {
                vec3 sR = sampleVogelBlur(uv, baseShiftUv * (1.0 + dispersionSpan * 0.42), blurPx);
                vec3 sY = sampleVogelBlur(uv, baseShiftUv * (1.0 + dispersionSpan * 0.21), blurPx);
                vec3 sG = sampleVogelBlur(uv, baseShiftUv, blurPx);
                vec3 sC = sampleVogelBlur(uv, baseShiftUv * (1.0 - dispersionSpan * 0.21), blurPx);
                vec3 sB = sampleVogelBlur(uv, baseShiftUv * (1.0 - dispersionSpan * 0.42), blurPx);

                refracted.r = sR.r * 0.68 + sY.r * 0.32;
                refracted.g = sY.g * 0.24 + sG.g * 0.52 + sC.g * 0.24;
                refracted.b = sC.b * 0.32 + sB.b * 0.68;
            } else {
                refracted = sampleVogelBlur(uv, baseShiftUv, blurPx);

            // Усиление насыщенности преломлённого фона ("Насыщенные цвета": Вкл.)

            // Плотность стекла (69%) и объёмная абсорбция (Розовый + Голубой -> Фиолетовый сплав)
            vec3 pinkTint   = vec3(1.00, 0.32, 0.68);
            vec3 blueTint   = vec3(0.20, 0.72, 1.00);
            vec3 violetTint = vec3(0.68, 0.30, 1.00);

            vec3 individualTint = mix(blueTint, pinkTint, w);
            float bridgeMix = 1.0 - abs(w - 0.5) * 2.0;
            float totalViolet = clamp(max(u_blend, bridgeMix * 0.88), 0.0, 1.0);
            vec3 glassTint = mix(individualTint, violetTint, totalViolet);

            float density = clamp(u_glassDensity, 0.0, 1.0);
            float fresnel = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.4);
            float tintMix = density * (0.48 + 0.42 * fresnel);

            // Beer-Lambert светопропускание через цветной кристалл высокой плотности (69%)
            vec3 crystalFilter = mix(vec3(1.0), 0.56 + 0.52 * glassTint, density * 0.90);
            vec3 bodyColor = mix(refracted * crystalFilter, glassTint, tintMix);
            bodyColor += glassTint * (0.04 + 0.12 * density + 0.14 * fresnel);

            // Блик по контуру и обводка (управляются u_contourGlint и u_rimBrightness)
            vec2 rimDir = normalize(slope2D + vec2(1e-5));
            float keyLight = max(dot(rimDir, normalize(vec2(-0.56, 0.83))), 0.0);
            float fillLight = max(dot(rimDir, normalize(vec2(0.56, -0.83))), 0.0);
            float directionalGlint = 0.22 + 0.88 * pow(keyLight, 1.55) + 0.48 * pow(fillLight, 1.85);

            float outerHairline = smoothstep(-2.3 * dpr, -0.25 * dpr, d);
            float innerCausticBand = smoothstep(-bevelWidth * 0.72, -bevelWidth * 0.24, d)
                                   * (1.0 - smoothstep(-bevelWidth * 0.24, -1.2 * dpr, d));

            float rimEnergy = (u_rimBrightness * 0.42) * mix(0.45, 1.15, u_contourGlint) * directionalGlint;
            vec3 outerRimColor = mix(vec3(1.0), glassTint * 1.25 + 0.35, 0.22);
            vec3 innerRimColor = mix(vec3(1.0), glassTint * 1.3 + 0.25, 0.42);

            vec3 finalGlass = bodyColor
                + outerRimColor * outerHairline * rimEnergy
                + innerRimColor * innerCausticBand * (0.28 * u_contourGlint * directionalGlint)
                + vec3(1.0) * fresnel * (0.24 * u_contourGlint);

            finalGlass = finalGlass / (1.0 + max(finalGlass - 0.85, 0.0) * 0.45);
            finalGlass = clamp(finalGlass, 0.0, 1.0);

            gl_FragColor = vec4(mix(color, finalGlass, mask), 1.0);

            const r = srgbToLinear(r8 / 255);
            const g = srgbToLinear(g8 / 255);
            const b = srgbToLinear(b8 / 255);

            const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
            const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
            const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;

            const l_ = Math.cbrt(l);
            const m_ = Math.cbrt(m);
            const s_ = Math.cbrt(s);

                L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
                a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
                b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
            };
        }

        function oklabToSrgb(L, a, b) {
            const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
            const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
            const s_ = L - 0.0894841775 * a - 1.2914855480 * b;

            const l = l_ * l_ * l_;
            const m = m_ * m_ * m_;
            const s = s_ * s_ * s_;

            const rLin = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
            const gLin = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
            const bLin = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;

            return [
                Math.round(linearToSrgb(rLin) * 255),
                Math.round(linearToSrgb(gLin) * 255),
                Math.round(linearToSrgb(bLin) * 255)
            ];

                const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
                const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
                const l = l_ * l_ * l_;
                const m = m_ * m_ * m_;
                const s = s_ * s_ * s_;
                const rLin = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
                const gLin = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;

            const hueBins = new Float64Array(360);
            const chromaSum = new Float64Array(360);
            let totalWeight = 0;

                let windowChroma = 0;
